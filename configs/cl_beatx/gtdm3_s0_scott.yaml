project_name: cl_gtdm3_s0_scott

is_train: True
ddp: False

beatx_data_path: datasets/beat_english_v2.0.0/
embody3d_path: datasets/embody_3d_aiagent/

deps_path: assets_dep/

# No HDF5 cache: BEATX chunks are built in memory from the raw files at startup.
beatx_source: raw
beatx_split_csv: configs/cl_beatx/beat_english_train_test_split.csv

# Held-out-pool codecs from configs/cl_beatx/codec_*_pool.yaml. These are stable
# symlinks to the timestamped run dirs, created after codec training.
lowerbodycodec_ckpt: experiments/cl_codec_lowertransvel_pool/last_2000.safetensors
upperbodycodec_ckpt: experiments/cl_codec_upperhands_pool/last_2000.safetensors
facecodec_ckpt: experiments/cl_codec_faceexp_pool/last_2000.safetensors



is_continue: False 

out_path: ./experiments/
dataset: unified
pose_norm: False
body_part: full


motion_fps: 25
lowertrans_nfeats: 61
upperlower_nfeats: 258 # full body 55 * 6 + 3 trans + 4 contact
face_nfeats: 106


random_seed: 2342

pose_length: 250
frame_chunk_size: 2
# datastride: 20
audio_sr: 24000
audio_fps: 24000

gestureformer_layers: 4
gestureformer_heads: 2
gestureformer_depformer_layers: 2
gestureformer_depformer_heads: 1

# gesturecode kwargs
transformer_layers: 8
convblock_layers: 2
transformer_heads: 4
num_temp_classifiers: 1
param_dtype: "bfloat16"
optim_dtype: "float32" 

# batch_size: 16
lr_base: 1e-4
loader_workers: 16
grad_norm: 1.0
opt: adamw
lr_policy: step

pretrain_warmup_epochs: 50 # 1
inputtoken_noise_prob: 0 # 0.05
memory_dropout_prob: 0.1
memory_embnoise_prob: 0 


drop_lower_crossattn: True 
lower_bodypart_dropprob: 0.1

gan_loss_weight: 0.0
contrastive_loss_weight: 0.1 # 0.1
genrecon_loss_weight: 0.0 # 0.5 # 0.1

vad_guidance: True
vad_use_face_logits: True
vad_loss_weight: 0.05 #5 # 5 # 0.1

trainer: UpperFaceLowerGTDM3 
face_loss_weight: 2.5

# Continual-learning session 0: scott only, main takes only, fixed BEAT2 speaker ids.
dataset_ratio: speakers_beatx_lowervalid
beatx_speakers: [scott]
exclude_additional: True
speaker_index_mode: beatx_id

textaudio_emb_freeze: False
varying_frame_length: False
align_first_frame_yaw: True

# MIBURI's single-speaker (scott) schedule, from gtdm3_audiotext_ufl_25_beatx_allspk.yaml
epochs: 100000
decay_epochs: 2000
test_period: 500
decay_rate: 0.8
log_period: 10
