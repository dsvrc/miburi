project_name: cl_codec_upperhands_pool
is_train: True
ddp: False
 
beatx_data_path: datasets/beat_english_v2.0.0/
embody3d_path: datasets/embody_3d_aiagent/

deps_path: assets_dep/

# No HDF5 cache: BEATX chunks are built in memory from the raw files at startup.
beatx_source: raw
beatx_split_csv: configs/cl_beatx/beat_english_train_test_split.csv

is_continue: False
# continue_ckpt: 



out_path: ./experiments/
dataset: unified

pose_norm: False


motion_fps: 25
nfeats: 258 # (13 + 30)*6


random_seed: 2342

pose_length: 250
frame_chunk_size: 2
datastride: 20
audio_sr: 24000
audio_fps: 24000

transformer_layers: 8
convblock_layers: 2
transformer_heads: 4
# 


batch_size: 32
smplx_chunk_per_batch_multiplier: 128

latent_dtype: bfloat16

audio_rep: None # melspec, wav2vec for mel change audio_fps # TODO: remove because this isnt used 
word_rep: bert_framealigned # bert_framealigned, bert, glove_framealigned # TODO: remove because this isnt used 
id_rep: idx # idx, onehot

body_part: upper


trainer: UpperBodyCausalCodec
lr_base: 1e-4
loader_workers: 16
grad_norm: 1.0
opt: adamw
lr_policy: step

rec_weight: 1
rec_pos_weight: 1
rec_aa_weight: 1
rec_6d_weight: 1
rec_ver_weight: 1
rec_loc_weight: 10
lap_weight: 2
mmd_weight: 1e-2
accel_penalty_weight: 5e-1

comloss_weight: 0.25
kl_warmup_epochs: 25

use_wavelet: False

varying_frame_length: True
align_first_frame_yaw: True

epochs: 2000

# Continual-learning tokenizer: trained on a held-out speaker pool that never appears
# in any session. For a scott-only tokenizer instead, pass --beatx_speakers scott.
dataset_ratio: speakers_beatx_lowervalid
beatx_speakers: [stewart, kieks, lu, carlos, jorge, daiki, li, luqi, hailing, kexin, goto, yingqing, tiffnay, katya]
exclude_additional: True


# change for allspk/1spk
decay_epochs: 100
test_period: 5
log_period: 50
decay_rate: 0.90
